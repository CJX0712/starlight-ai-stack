<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starlight AI Stack · 本地知识库控制台</title>
<style>
:root{
  --bg:#0f1115; --surface:#161a22; --surface-2:#1c212b; --border:#252c39;
  --text:#e6e9ef; --muted:#98a2b3; --accent:#4f8cff; --accent-soft:#1e3a6b;
  --success:#3fb950; --warn:#d29922; --danger:#f85149;
  --radius:10px; --radius-lg:14px; --font:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6}
button,input{font-family:inherit;font-size:14px}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand svg{width:20px;height:20px;stroke:var(--accent)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12px}
.pill b{color:var(--text);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--success)} .dot.bad{background:var(--danger)} .dot.wait{background:var(--warn)}
main{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:16px;padding:16px;height:calc(100vh - 61px)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden}
.panel h2{margin:0;padding:12px 16px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel h2 svg{width:15px;height:15px;stroke:var(--muted)}
.body{padding:14px 16px;overflow:auto}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);color:var(--text)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
button{padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;margin-top:10px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv span:first-child{color:var(--muted)}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:10px 14px;border-radius:var(--radius-lg);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent)}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border)}
.msg .meta{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
.composer input{flex:1}
.cite{display:block;margin-top:8px;padding:8px 10px;border-left:2px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:12px;color:var(--muted)}
.cite b{color:var(--text);font-weight:500}
.res{border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:10px;background:var(--surface-2)}
.res .top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.res .txt{font-size:12px;color:var(--text);max-height:110px;overflow:auto;white-space:pre-wrap}
.badge{display:inline-block;padding:1px 6px;border:1px solid var(--border);border-radius:6px;margin-right:4px;font-family:var(--mono);font-size:11px}
.note{color:var(--muted);font-size:12px;margin-top:10px;white-space:pre-wrap}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:1100px){main{grid-template-columns:1fr;height:auto}.panel{max-height:420px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 10l-5.8 1.4L12 17l-2.2-5.6L4 10l5.8-1.4L12 3z"/></svg>
    Starlight AI Stack
  </div>
  <div class="pills">
    <span class="pill"><i class="dot" id="dot-backend"></i>后端 <b id="p-backend">检查中</b></span>
    <span class="pill">档位 <b id="p-profile">-</b></span>
    <span class="pill">LLM <b id="p-llm">-</b></span>
    <span class="pill">嵌入 <b id="p-embed">-</b></span>
    <span class="pill">块 <b id="p-chunks">0</b></span>
  </div>
</header>

<main>
  <section class="panel">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      资料摄取
    </h2>
    <div class="body">
      <label for="path">本地目录或文件绝对路径</label>
      <input id="path" type="text" placeholder="例如 C:\Users\me\docs" />
      <div class="row">
        <button class="primary" id="btn-ingest">摄取进库</button>
        <button id="btn-stats">刷新状态</button>
      </div>
      <div class="note" id="ingest-note">支持 txt / md / html / pdf / json / csv / log，重复摄取自动跳过。</div>
      <div style="margin-top:16px">
        <div class="kv"><span>文档数</span><b id="s-docs">0</b></div>
        <div class="kv"><span>块数</span><b id="s-chunks">0</b></div>
        <div class="kv"><span>词项数</span><b id="s-terms">0</b></div>
        <div class="kv"><span>向量维度</span><b id="s-dim">-</b></div>
      </div>
    </div>
  </section>

  <section class="panel chat">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M21 12a8 8 0 01-8 8H7l-4 3v-6a8 8 0 018-8h2a8 8 0 018 3z"/></svg>
      问答（流式）
    </h2>
    <div id="log"></div>
    <div class="composer">
      <input id="q" type="text" placeholder="基于知识库提问，例如：报销需要在几号前提交？" />
      <button class="primary" id="btn-ask">发送</button>
    </div>
  </section>

  <section class="panel">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      检索结果与引用
    </h2>
    <div class="body" id="ctx"><div class="note">提问后显示本轮召回的片段与引用。</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function setDot(el, state){ el.className = "dot " + state; }

async function refresh(){
  try{
    const r = await fetch("/health");
    const d = await r.json();
    setDot($("dot-backend"), d.backend_up ? "ok" : "bad");
    $("p-backend").textContent = d.backend_up ? "在线" : "离线";
    $("p-profile").textContent = d.profile || "-";
    $("p-llm").textContent = d.llm || "-";
    $("p-embed").textContent = d.embed || "-";
    $("p-chunks").textContent = (d.stats && d.stats.chunks) || 0;
    $("s-docs").textContent = (d.stats && d.stats.docs) || 0;
    $("s-chunks").textContent = (d.stats && d.stats.chunks) || 0;
    $("s-terms").textContent = (d.stats && d.stats.lexicon_terms) || 0;
    $("s-dim").textContent = (d.stats && d.stats.dim) || "-";
    if (d.notes && d.notes.length){
      $("ingest-note").textContent = "模型降级说明：" + d.notes.join("；");
    }
  }catch(e){
    setDot($("dot-backend"), "bad");
    $("p-backend").textContent = "未连接";
  }
}

function addMsg(role, text){
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = esc(text);
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function renderCtx(list){
  const box = $("ctx");
  if(!list || !list.length){ box.innerHTML = '<div class="note">本轮没有召回到知识库片段。</div>'; return; }
  box.innerHTML = list.map((s,i) => `
    <div class="res">
      <div class="top">
        <span><span class="badge">[${i+1}]</span>${esc((s.source||"").split(/[\\/]/).pop())}</span>
        <span>RRF ${s.score}</span>
      </div>
      <div class="txt">${esc(s.text)}</div>
      <div class="top" style="margin:6px 0 0">
        <span>稠密 ${s.dense_score} · 稀疏 ${s.sparse_score}</span>
        <span>秩 ${s.dense_rank==null?"-":s.dense_rank} / ${s.sparse_rank==null?"-":s.sparse_rank}</span>
      </div>
    </div>`).join("");
}

function renderCites(el, cites){
  if(!cites || !cites.length) return;
  const box = document.createElement("div");
  box.innerHTML = cites.map(c => `<div class="cite"><b>[${c.index}]</b> ${esc((c.source||"").split(/[\\/]/).pop())} · ${esc(c.excerpt)}</div>`).join("");
  el.appendChild(box);
}

async function ask(){
  const q = $("q").value.trim();
  if(!q) return;
  $("q").value = "";
  $("btn-ask").disabled = true;
  addMsg("user", q);
  const bot = addMsg("bot", "");
  bot.innerHTML = '<span class="spin"></span> 检索与生成中';
  let acc = "";
  try{
    const resp = await fetch("/chat/stream", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({query:q, k:5})
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for(const p of parts){
        if(!p.startsWith("data:")) continue;
        const ev = JSON.parse(p.slice(5).trim());
        if(ev.type === "context"){ renderCtx(ev.results); }
        else if(ev.type === "delta"){ acc += ev.text; bot.textContent = acc; $("log").scrollTop = $("log").scrollHeight; }
        else if(ev.type === "done"){ renderCites(bot, ev.citations); }
      }
    }
    if(!acc) bot.textContent = "（没有拿到模型输出）";
  }catch(e){
    bot.textContent = "请求失败：" + e.message;
  }
  $("btn-ask").disabled = false;
}

async function ingest(){
  const p = $("path").value.trim();
  if(!p){ $("ingest-note").textContent = "请先填写路径。"; return; }
  $("btn-ingest").disabled = true;
  $("ingest-note").innerHTML = '<span class="spin"></span> 摄取中，首次会做向量化，请稍候';
  try{
    const r = await fetch("/ingest", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({path:p})});
    const d = await r.json();
    if(!r.ok){ $("ingest-note").textContent = "失败：" + (d.detail || "未知错误"); }
    else{
      $("ingest-note").textContent = `扫描 ${d.scanned} 个文件：新增 ${d.added}，跳过 ${d.skipped}（内容未变），失败 ${d.failed}；新入库块 ${d.chunks}。`;
      refresh();
    }
  }catch(e){ $("ingest-note").textContent = "请求失败：" + e.message; }
  $("btn-ingest").disabled = false;
}

$("btn-ask").onclick = ask;
$("btn-ingest").onclick = ingest;
$("btn-stats").onclick = refresh;
$("q").addEventListener("keydown", e => { if(e.key === "Enter") ask(); });
refresh();
</script>
</body>
</html>
